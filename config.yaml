name: ESP BLE Bridge
version: 0.60.1

slug: esp-ble-bridge
description: Control BRMesh/FastCon BLE lights from Home Assistant through ESP32 controllers, set up from your BRMesh app export
url: https://github.com/Zoft123/ha-esp-ble-bridge
# ESPHome/PlatformIO only provide ESP32 toolchains for 64-bit hosts.
arch:
  - aarch64
  - amd64
init: false
uart: true
usb: true
hassio_api: true
homeassistant_api: true
services:
  - mqtt:want
host_network: true
map:
  - config:rw
ingress: true
ingress_port: 8099
panel_icon: mdi:lightbulb-group
webui: http://[HOST]:[PORT:8099]
options:
  wifi_domain: ""
schema:
  wifi_domain: str?
