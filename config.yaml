# Home Assistant add-on (app) definition.
name: ESP BLE Bridge
version: 0.62.0
slug: esp-ble-bridge
description: Control BRMesh/FastCon Bluetooth lights from Home Assistant through ESP32 controllers, and pair new lamps without the phone app
url: https://github.com/Zoft123/ha-esp-ble-bridge
# The ESP32 toolchains ESPHome downloads exist for 64-bit hosts only.
arch: [aarch64, amd64]
init: false
startup: application
# Serial ports, to install firmware on an ESP32 plugged into the Home Assistant machine.
uart: true
usb: true
# Finds the controllers' entities and controls the lights through the Home Assistant API.
hassio_api: true
homeassistant_api: true
host_network: true
map:
  - config:rw
ingress: true
ingress_port: 8099
panel_icon: mdi:lightbulb-group
webui: http://[HOST]:[PORT:8099]
options:
  wifi_domain: ""
schema:
  wifi_domain: str?
